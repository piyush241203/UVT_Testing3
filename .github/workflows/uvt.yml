name: Visual Regression Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  visual-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for selective testing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: UVT Environment Diagnostic
        run: |
          echo "=== UVT Environment ==="
          echo "Package Manager : npm"
          echo "Workspace       : No"
          echo "Framework       : React (Vite)"
          echo "CLI Source      : Local (uvt-packages/cli)"
          echo "Node            : $(node -v)"
          echo "Working Dir     : $(pwd)"

          if npx playwright --version &>/dev/null; then
            echo "Playwright      : Installed"
          else
            echo "Playwright      : Not Installed"
          fi

          echo "=== Percy Diagnostics ==="
          if [ -n "$PERCY_TOKEN" ]; then
            echo "PERCY_TOKEN: Present"
            echo "Length: ${#PERCY_TOKEN}"
            MASKED_TOKEN="${PERCY_TOKEN:0:4}****${PERCY_TOKEN: -4}"
            echo "Masked: $MASKED_TOKEN"
          else
            echo "PERCY_TOKEN: Not Present"
          fi

          if npx percy --version &>/dev/null; then
            echo "Percy CLI: $(npx percy --version)"
          else
            echo "Percy CLI: Not Installed"
          fi

          echo "--- Percy Environment Variables ---"
          env | grep PERCY || echo "No other PERCY_* vars found"

          echo "======================="
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Cache Percy Browser
        uses: actions/cache@v4
        with:
          path: ~/.local/share/percy
          key: ${{ runner.os }}-percy-${{ hashFiles('**/package-lock.json') }}

      - name: Build frontend application
        run: npm run build --if-present
        continue-on-error: true

      - name: Run visual regression tests
        # CORRECT PATTERN: npx percy exec -- <uvt command>
        # Percy exec starts the Percy agent, sets PERCY_SERVER_ADDRESS,
        # then runs the child command which connects to the agent automatically.
        # UVT auto-starts and stops the dev server internally (port 5173 for Vite).
        run: npx percy exec -- node uvt-packages/cli/dist/bin.js test --all --port 5173
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

      - name: Print Percy logs
        if: always()
        run: |
          if [ -f .uvt/percy.log ]; then
            echo "=== Percy CLI Logs ==="
            cat .uvt/percy.log
          else
            echo "No Percy CLI logs found."
          fi

      - name: Teardown background processes
        if: always()
        run: pkill -f "vite" || true
